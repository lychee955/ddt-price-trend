name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv build
      - name: Verify wheel contents
        run: uv run python .github/scripts/check_wheel.py
      - name: Build Pages mode
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_MODE: 'true'
          VITE_BASE_PATH: /ddt-price-trend/
